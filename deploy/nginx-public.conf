# 公网部署用的 Nginx 配置样例（含 HTTPS 与限流）
#
# 用法：
#   1. 把本文件放到服务器 /etc/nginx/conf.d/ai-kb.conf
#   2. 把 your-domain.com 换成你的域名
#   3. 首次申请证书：certbot --nginx -d your-domain.com
#      （certbot 会自动补全 ssl_certificate 两行，下面已按它的格式写好占位）
#   4. nginx -t && systemctl reload nginx
#
# 说明：容器内的 frontend 服务自己监听 80 并反代 /api 到 backend，
#       这里是最外层入口，负责 HTTPS 与限流。若直接暴露容器，可跳过本文件。

# 限流区：按 IP 每秒 5 个请求，突发 10 个；上传单独更严
limit_req_zone $binary_remote_addr zone=api_general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=5r/m;

server {
    listen 80;
    server_name your-domain.com;
    # ACME 校验放行
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传上限与后端一致（100MB）
    client_max_body_size 100m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端（容器 frontend 的 80）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传接口单独限流（每分钟 5 次，按 IP）
    location = /api/upload {
        limit_req zone=api_upload burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;   # 大文件入库可能很久
    }

    # 其余 API：普通限流 + 流式不缓冲
    location /api/ {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则回答会变成"一次性返回"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
